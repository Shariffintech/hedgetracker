name: Fund discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install OpenBB SEC provider
        run: python -m pip install openbb-sec==2.0.0
      - name: Discover recent Form D leads
        run: python pipeline/openbb_discover.py --output dashboard/data/intake.json
      - name: Run credibility evals
        run: cargo run --locked --manifest-path dashboard/Cargo.toml --bin fund_agent -- dashboard/data/intake.json pipeline/reviews.json dashboard/data/discovery.json
      - name: Save review queue and source intake
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fund-discovery-report
          path: |
            dashboard/data/intake.json
            dashboard/data/discovery.json
          if-no-files-found: warn
